
spring:
  application:
    name: burger-menu-service

  datasource:
    url: jdbc:postgresql://localhost:5432g/burgerhome_menu
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
